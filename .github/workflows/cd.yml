name: Pern Stack CD

on:
  workflow_run:
    workflows:
      - Pern Stack CI
    types:
      - completed
    branches:
      - main
      

jobs:
  deploy:
    name: Deploy Application
    runs-on: self-hosted

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'

    steps:
      - name: Checkout Successful CI Commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Update Deployment Repository
        run: |
          cd /home/franklyn/my_folder/cloned_repos/Undeployed/pern-stack

          git fetch origin ${{ github.event.workflow_run.head_sha }}
          git reset --hard ${{ github.event.workflow_run.head_sha }}

      - name: Build and Deploy Application
        run: |
          cd /home/franklyn/my_folder/cloned_repos/Undeployed/pern-stack

          docker compose up -d --build

      - name: Run Database Migrations
        run: |
          cd /home/franklyn/my_folder/cloned_repos/Undeployed/pern-stack

          docker compose exec -T backend npm run migrate

      - name: Verify Deployment
        run: |
          cd /home/franklyn/my_folder/cloned_repos/Undeployed/pern-stack

          docker compose ps

          curl --fail http://localhost:3001/api/health/ready

        

  
  



