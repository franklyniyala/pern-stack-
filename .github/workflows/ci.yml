name: Pern Stack CI

on:
  push:
    branches:
        - main
        - develop

  pull_request:
    branches:
        - main

permissions:
    contents: read

jobs:
  frontend-ci:
    name: Frontend CI 
    runs-on: self-hosted

    defaults:
        run:
            working-directory: ./frontend

    steps: 
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 22
            cache: npm
            cache-dependency-path: ./frontend/package-lock.json
        
        - name: Install Dependencies
          run: npm ci

        - name: Frontend Build
          run: npm run build

  backend-ci:
    name: Backend CI
    runs-on: self-hosted

    defaults:
        run: 
          working-directory: ./backend

    steps:
        - name: Checkout Repository
          uses: actions/checkout@v4 

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 22
            cache: npm
            cache-dependency-path: ./backend/package-lock.json
            
        - name: Install Dependencies
          run: npm ci

        - name: Backend Tests
          run: npm test

  sonarqube-analysis:
    name: SonarQube Analysis
    runs-on: self-hosted

    needs:
      - frontend-ci
      - backend-ci

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Sonarqube Scan
        uses: sonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://localhost:9000

      

        


          

        




